<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Espaço Carmem Lúcia | Funcionários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../base.css" />
  <link rel="stylesheet" href="funcionarios.css" />
</head>
<body>

  <div class="overlay" id="overlay" onclick="fecharMenu()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../img/logo.png" alt="Logo" class="sidebar-logo" />
      <span class="sidebar-nome">Espaço Carmem Lúcia</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="../index-home/home.html"><i class="fa-solid fa-house"></i> Início</a></li>
      <li><a href="../agendamentos/agendamentos.html"><i class="fa-solid fa-calendar-days"></i> Agendamentos</a></li>
      <li><a href="../cliente/clientes.html"><i class="fa-solid fa-users"></i> Clientes</a></li>
      <li><a href="funcionarios.html" class="menu-ativo"><i class="fa-solid fa-id-badge"></i> Funcionários</a></li>
      <li><a href="../servico/servico.html"><i class="fa-solid fa-scissors"></i> Serviços</a></li>
      <li><a href="../financas/financas.html"><i class="fa-solid fa-chart-line"></i> Finanças</a></li>
    </ul>
  </nav>

  <main class="phone">

    <header class="topbar">
      <div class="topbar-logo">
        <a href="../index-home/home.html"><img src="../img/logo.png" alt="Logo CL" /></a>
      </div>
      <div class="topbar-right">
        <button class="btn-hamburguer" onclick="abrirMenu()" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatar" onclick="togglePerfil(event)"></div>
          <div class="perfil-dropdown" id="perfilDropdown">
            <div class="perfil-info">
              <p class="perfil-nome" id="perfilNome"></p>
              <p class="perfil-email" id="perfilEmail"></p>
            </div>
            <a href="../login/login.html" class="perfil-sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </header>

    <div class="tela-header">
      <button class="btn-voltar" onclick="history.back()" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="tela-titulo">Funcionários</h2>
    </div>

    <section class="clientes-acoes">
      <div class="clientes-btns">
        <button class="btn-acao" onclick="window.location.href='cadastrar-funcionario.html'">
          <i class="fa-solid fa-user-plus"></i> Novo Funcionário
        </button>
      </div>
      <div class="clientes-pesquisa">
        <i class="fa-solid fa-magnifying-glass pesquisa-icone"></i>
        <input type="text" id="campoPesquisa" class="input-pesquisa"
          placeholder="Pesquisar funcionário..." oninput="filtrarFuncionarios()" />
      </div>
    </section>

    <section class="clientes-tabela-wrap">
      <table class="clientes-tabela">
        <thead>
          <tr>
            <th class="col-check">
              <input type="checkbox" id="checkTodos" onchange="toggleTodos(this)" />
            </th>
            <th>Nome</th>
            <th class="text-center">CPF</th>
            <th class="text-center">Telefone</th>
            <th class="text-center">Nascimento</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
      </table>
      <p class="tabela-vazia" id="tabelaVazia" style="display:none;">
        Nenhum funcionário encontrado.
      </p>
    </section>

    <!-- RODAPÉ: botões Atualizar, Lançar Folga, Alterar Status (escadinha menor→maior) -->
    <div class="clientes-rodape">
      <button class="btn-acao btn-acao-secundario agend-escada-1" id="btnAtualizar"
              onclick="abrirModalAtualizar()" disabled>
        <i class="fa-solid fa-pen-to-square"></i> Atualizar
      </button>
      <button class="btn-acao agend-escada-2" id="btnLancarFolga"
              onclick="abrirModalFolga()" disabled>
        <i class="fa-solid fa-calendar-xmark"></i> Lançar Folga
      </button>
      <button class="btn-acao agend-escada-3" id="btnAlterarStatus"
              onclick="abrirModalStatus()" disabled>
        <i class="fa-solid fa-circle-half-stroke"></i> Alterar Status
      </button>
    </div>

  </main>

  <!-- Modal: Atualizar Funcionário -->
  <div class="modal-overlay" id="modalAtualizar">
    <div class="modal">
      <div class="modal-header">
        <h3>Atualizar Funcionário</h3>
        <button class="modal-fechar" onclick="fecharModal('modalAtualizar')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="formAtualizar">
          <div class="field">
            <label for="editNome">Nome</label>
            <input type="text" id="editNome" name="editNome" />
          </div>
          <div class="field">
            <label for="editCpf">CPF</label>
            <input type="text" id="editCpf" name="editCpf" maxlength="14" />
          </div>
          <div class="field">
            <label for="editTelefone">Telefone</label>
            <input type="tel" id="editTelefone" name="editTelefone" maxlength="15" />
          </div>
          <div class="field">
            <label for="editNascimento">Data de Nascimento</label>
            <input type="date" id="editNascimento" name="editNascimento" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <div class="form-btns" style="width:100%">
          <button type="button" class="btn-form-limpar" onclick="fecharModal('modalAtualizar')">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>
          <button type="submit" class="btn-form-cadastrar" form="formAtualizar">
            <i class="fa-solid fa-check"></i> Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Alterar Status do Funcionário -->
  <div class="modal-overlay" id="modalStatus">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalStatusTitulo">Alterar Status</h3>
        <button class="modal-fechar" onclick="fecharModal('modalStatus')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="modal-body" style="text-align:center; padding:24px 20px;">
        <p id="modalStatusTexto"
           style="font-family:'Jost',sans-serif; font-size:0.95rem; color:var(--text); line-height:1.6; margin:0 0 20px;"></p>
        <div class="form-btns">
          <button type="button" class="btn-form-limpar" onclick="fecharModal('modalStatus')">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>
          <button type="button" class="btn-form-cadastrar" id="btnConfirmarStatus" onclick="confirmarStatus()">
            <i class="fa-solid fa-circle-check"></i> <span id="btnStatusLabel">Confirmar</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Lançar Folga -->
  <div class="modal-overlay" id="modalFolga">
    <div class="modal">
      <div class="modal-header">
        <h3>Lançar Folga</h3>
        <button class="modal-fechar" onclick="fecharModal('modalFolga')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="modal-body">
        <p id="modalFolgaNome"
           style="font-family:'Jost',sans-serif; font-size:0.9rem; color:var(--text-soft); margin-bottom:16px;"></p>
        <div class="field">
          <label for="folgaData">Data da Folga</label>
          <input type="date" id="folgaData" name="folgaData" />
        </div>
        <div class="field">
          <label for="folgaMotivo">Motivo</label>
          <input type="text" id="folgaMotivo" name="folgaMotivo" placeholder="Ex: Folga semanal, Falta, Férias..." />
        </div>
      </div>
      <div class="modal-footer">
        <div class="form-btns" style="width:100%">
          <button type="button" class="btn-form-limpar" onclick="fecharModal('modalFolga')">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>
          <button type="button" class="btn-form-cadastrar" onclick="confirmarFolga()">
            <i class="fa-solid fa-calendar-xmark"></i> Lançar
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toastFunc" class="toast-cl"></div>
  <script src="funcionario.js"></script>
</body>
</html>
